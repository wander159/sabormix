{% extends "base.html" %}
{% block content %}
<h2>Observação da Venda #{{ venda.id }}</h2>
<p><strong>Item:</strong> {{ venda.item_nome }} | <strong>Cliente:</strong> {{ venda.cliente_nome }}</p>
<form method="post">
    <label>Observação</label><br>
    <textarea name="observacao" rows="4" style="width:100%;">{{ venda.observacao or '' }}</textarea>
    <div class="mt-2">
        <button class="btn-success" type="submit">Salvar</button>
        <!-- BOTÃO VOLTAR AGORA MANTÉM TODOS OS FILTROS -->
        <a class="btn-secondary" href="{{ url_for('historico', inicio=inicio or '', fim=fim or '', cliente=cliente or '', obs=obs or '') }}">Voltar</a>
    </div>
</form>
{% endblock %}
