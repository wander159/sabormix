{% extends "base.html" %}
{% block content %}
<h2>Usuários</h2>

<h3>Cadastrar Usuário</h3>
<form method="post" action="{{ url_for('usuarios_salvar') }}">
    <input type="hidden" name="id" value="{{ edit_user.id if edit_user else '' }}">
    <div class="row">
        <div class="col">
            <label>Nome</label><br>
            <input type="text" name="nome" required value="{{ edit_user.nome if edit_user else '' }}">
        </div>
        <div class="col">
            <label>Senha {{ '(deixe em branco para manter)' if edit_user else '' }}</label><br>
            <input type="password" name="senha" {{ 'required' if not edit_user else '' }}>
        </div>
        <div class="col">
            <label>Tipo</label><br>
            <select name="tipo">
                <option value="gerente" {% if edit_user and edit_user.tipo=='gerente' %}selected{% endif %}>Gerente</option>
                <option value="funcionario" {% if edit_user and edit_user.tipo=='funcionario' %}selected{% endif %}>Funcionário</option>
            </select>
        </div>
    </div>
    <div class="mt-2">
        <button class="btn-success" type="submit">{{ 'Salvar Alterações' if edit_user else 'Adicionar Usuário' }}</button>
        {% if edit_user %}
        <a class="btn-secondary" href="{{ url_for('usuarios') }}">Cancelar edição</a>
        {% endif %}
    </div>
</form>

<hr>
<h3>Lista de Usuários</h3>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
    {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.nome }}</td>
            <td>{{ u.tipo }}</td>
            <td>
                <a class="btn-warning" href="{{ url_for('usuarios', edit_id=u.id) }}">Editar</a>
                <form method="post" action="{{ url_for('usuarios_excluir', user_id=u.id) }}" style="display:inline;" onsubmit="return confirm('Excluir este usuário?');">
                    <button class="btn-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
